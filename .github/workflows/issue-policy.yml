name: issue-policy

# pull_request_target runs the workflow from the base branch. Check out the base
# ref explicitly and run only the trusted checker; never check out PR code here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue:
    name: Issue policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the issue policy
        run: node --test scripts/issue-policy.test.mjs
      - name: Require a linked issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/issue-policy.mjs
