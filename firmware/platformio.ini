; LifeLink tracker — ESP32 DevKit V1 (30-pin, DOIT layout)
;
; The relay-era firmware is intentionally not copied. This project has
; one output (the buzzer) and one uplink (the A7670E). The safety direction is
; inverted: never suppress an alert because a reading is uncertain.
;
;   pio run -d firmware
;   pio test -d firmware -e native
;
[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
; cppcheck has a known false positive in ArduinoJson's preprocessor macros
; (preprocessorErrorDirective). The library is third-party, so suppress that
; diagnostic class rather than editing the dependency.
check_tool = cppcheck
check_flags =
    cppcheck: --suppress=preprocessorErrorDirective
build_flags =
    -std=gnu++17
    -DFW_VERSION=\"0.3.1\"
; Optional SSD1306 status panel and battery-backed DS3231 clock. The display
; and RTC libraries are pinned to exact versions so a registry update cannot
; silently change the build. The panel is not used by the native test
; environment.
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/RTClib@2.1.4

; Bench-only watchdog proof. The default build refuses TEST_WDT; this
; environment compiles the blocking command. Build it explicitly:
;   pio run -d firmware -e esp32dev-bench
[env:esp32dev-bench]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DLIFELINK_BENCH_WDT=1

; Host-native tests for the pure logic. The sketch needs the ESP32 core and is
; excluded; the test includes main/*.h directly.
[env:native]
platform = native
build_flags = -std=gnu++17 -static -static-libgcc -static-libstdc++ -Iinclude
build_src_filter = -<*>
test_build_src = no
test_framework = unity
