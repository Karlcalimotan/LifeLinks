packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - "prisma"
  - "sharp"
